<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Service as Offer 购后预约流程设计稿：查看支付与预约结果">
  <title>05 · 支付结果 · Service as Offer</title>
  <link rel="stylesheet" href="05-payment-result.css?v=20261104-one-css">
  <link rel="stylesheet" href="components/store-time-picker.css?v=20261109-rule-alignment">
  <link rel="stylesheet" href="journey-panel.css?v=20261109">
  <script src="components/order-summary.js?v=20261109"></script>
  <script src="journey-map.js?v=20261109" defer></script>
  <script src="service-journey.js?v=20261109-journey-map" defer></script>
  <script src="components/prototype-nav.js?v=20261109-shared-nav" defer></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="figma-capture-toolbar.js" defer></script>
</head>
<body data-page="order">
  <main class="presentation">
    <article class="artboard" aria-label="小程序设计画板：支付结果">
      <prototype-nav title="支付结果" back-href="02-service-detail.html" back-label="返回服务详情"></prototype-nav>
      <section class="body">
        <div class="status-card" data-payment-state="paid" role="status" aria-live="polite">
          <div class="status-head"><span class="check" aria-hidden="true"><img src="assets/figma/selection-check.svg" alt=""></span><div><div class="status-title">支付成功</div><div class="status-sub" id="status-subtitle">支付已完成，现在可以预约服务</div></div></div>
        </div>
        <section class="section">
          <h3 class="section-title">已购服务</h3>
          <div class="service"></div><script>OrderSummary.mount(document.currentScript.previousElementSibling, "paymentResult");</script>
          <div class="rows">
            <div class="row"><span id="payment-amount-label">实付金额</span><strong id="payment-amount" class="price"><span class="price-currency">¥</span><span class="price-major">199</span><span class="price-decimal">.90</span></strong></div>
            <div class="row"><span>支付方式</span><strong id="payment-method">微信支付</strong></div>
            <div class="row" id="booking-row" hidden><span>预约结果</span><strong id="booking-result">已预约，待到店</strong></div>
            <div class="row" id="booking-store-row" hidden><span>预约门店</span><strong id="booking-store">迪卡侬上海五角场店</strong></div>
            <div class="row" id="booking-time-row" hidden><span>预约时间</span><strong id="booking-time">11-03 14:00</strong></div>
            <div class="row"><span>服务单号</span><strong id="payment-order">SO-2601024</strong></div>
          </div>
        </section>
      </section>
      <footer class="foot"><button class="cta" id="primary-action" type="button">立即预约</button><a class="flow-secondary" id="result-order-link" href="10-service-order-detail.html">查看订单详情</a></footer>
      <div class="payment-loading-toast" id="payment-loading-toast" role="status" aria-live="polite" hidden><span class="loading-indicator" aria-hidden="true"></span><span>正在确认支付结果，请勿重复支付</span></div>
    </article>
    <aside class="annotation">
      <section class="prototype-controls" aria-labelledby="state-heading">
        <h2 id="state-heading">状态切换</h2>
        <p>待确认时展示 loading toast，并每 1.5 秒模拟一次后台查询。点击成功 / 失败按钮提供下次查询结果；不会自动推定成功。频率仅供演示，不是生产契约。</p>
        <div class="state-options" role="group" aria-label="订单支付状态">
          <button type="button" class="state-option" data-payment-state="paid" aria-pressed="true">支付成功</button>
          <button type="button" class="state-option" data-payment-state="unpaid" aria-pressed="false">支付失败</button>
          <button type="button" class="state-option" data-payment-state="unknown" aria-pressed="false">支付结果待确认</button>
        </div>
        <div class="state-options" id="booking-state-options" role="group" aria-label="预约结果状态" hidden>
          <button type="button" class="state-option" data-booking-state="created" aria-pressed="true">预约成功</button>
          <button type="button" class="state-option" data-booking-state="conflict" aria-pressed="false">预约冲突</button>
          <button type="button" class="state-option" data-booking-state="unknown" aria-pressed="false">预约待确认</button>
        </div>
        <p class="control-feedback" id="state-description" role="status">支付成功后点击“立即预约”选择服务门店与时段。</p>
      </section>
      <nav class="flow-nav" aria-label="购后流程页面">
        <h2>流程导航</h2>
        <div class="flow-links">
          <a class="flow-link" href="05-payment-result.html" aria-current="step">05 · 支付结果</a>
          <a class="flow-link" href="10-service-order-detail.html?selectBooking=1">选择门店与时间</a>
          <a class="flow-link" href="06-appointment-result.html">06 · 预约结果</a>
        </div>
      </nav>
    </aside>
  </main>
  <script src="post-purchase-flow.js?v=20261103-picker"></script>
</body>
</html>
