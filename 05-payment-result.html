<body data-page="order">
  <main class="presentation">
    <article class="artboard" aria-label="小程序设计画板：支付结果">
      <div class="statusbar"><span>9:41</span><div class="status-icons"><span class="signal">▂▄▆</span><span>⌁</span><span class="battery"></span></div></div>
      <header class="nav"><a class="back" href="02-service-detail.html" aria-label="返回服务详情">‹</a><span class="nav-title">支付结果</span><span class="more" aria-hidden="true">···</span></header>
      <section class="body">
        <div class="status-card" data-payment-state="paid" role="status" aria-live="polite">
          <div class="status-head"><span class="check" aria-hidden="true">✓</span><div><div class="status-title">支付成功</div><div class="status-sub">支付已完成，现在可以预约服务</div></div></div>
        </div>
        <section class="section">
          <h3 class="section-title">已购服务</h3>
          <div class="service">
            <div class="service-thumb" aria-hidden="true">
              <svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="#5e5e5e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="32" r="8"/><circle cx="37" cy="32" r="8"/><path d="m11 32 9-15 8 15H11l13-9 13 9M20 17h8m-8 0-2-4m12 4 2-5h5"/></g></svg>
            </div>
            <div class="service-info"><div class="service-name">自行车标准保养套餐</div><div class="service-meta">到店服务 · 支付后选择门店和时间</div></div>
          </div>
          <div class="rows">
            <div class="row"><span id="payment-amount-label">实付金额</span><strong id="payment-amount">¥199.90</strong></div>
            <div class="row"><span>支付方式</span><strong id="payment-method">微信支付</strong></div>
            <div class="row"><span>服务单号</span><strong id="payment-order">SO-2601024</strong></div>
          </div>
        </section>
      </section>
      <footer class="foot"><button class="cta" id="primary-action" type="button">立即预约</button><a class="flow-secondary" id="result-order-link" href="12-service-order-detail.html">查看订单详情</a></footer>
    </article>
    <aside class="annotation">
      <section class="prototype-controls" aria-labelledby="state-heading">
        <h2 id="state-heading">状态切换</h2>
        <p>切换订单状态，查看当前可执行的操作。</p>
        <div class="state-options" role="group" aria-label="订单支付状态">
          <button type="button" class="state-option" data-payment-state="paid" aria-pressed="true">支付成功</button>
          <button type="button" class="state-option" data-payment-state="unpaid" aria-pressed="false">支付失败</button>
          <button type="button" class="state-option" data-payment-state="unknown" aria-pressed="false">支付结果待确认</button>
        </div>
        <p class="control-feedback" id="state-description" role="status">支付成功后点击“立即预约”选择服务门店与时段。</p>
