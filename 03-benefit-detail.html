<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="权益详情设计页：了解兑换服务，核对购买商品，使用权益而无需再次支付。">
  <title>权益详情设计稿 · Service as Offer</title>
  <link rel="stylesheet" href="03-benefit-detail.css?v=20261109-rule-alignment">
  <link rel="stylesheet" href="components/store-time-picker.css?v=20261109-rule-alignment">
  <link rel="stylesheet" href="journey-panel.css?v=20261109">
  <script src="journey-map.js?v=20261109" defer></script>
  <script src="service-journey.js?v=20261109-journey-map" defer></script>
  <script src="components/prototype-nav.js?v=20261109-shared-nav" defer></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="figma-capture-toolbar.js" defer></script>
</head>
<body class="benefit-detail">
  <svg hidden aria-hidden="true"><defs>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 6-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m4 2 2-2a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v.1"/></symbol>
  </defs></svg>
  <div class="presentation">
    <div class="phone">
      <div class="screen">
        <prototype-nav title="权益详情" back-href="01-service-entry.html?scenario=benefits" back-label="返回首页权益"></prototype-nav>
        <main id="content"></main>
        <footer class="footer">
          <div class="footer-note"><strong id="footer-label">权益兑换，无需支付</strong><small>适用于关联商品</small></div>
          <button class="primary" id="redeem" type="button">使用权益兑换</button>
        </footer>
        <div class="overlay" id="overlay" hidden>
          <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
            <div class="handle" aria-hidden="true"></div>
            <h2 id="sheet-title"></h2><p id="sheet-description"></p><dl id="sheet-summary"></dl>
            <button class="primary" id="confirm" type="button">确认兑换并预约</button>
            <button class="secondary" id="close" type="button">暂不兑换</button>
          </section>
        </div>
        <div class="dialog-overlay" id="success-overlay" hidden>
          <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="success-title" aria-describedby="success-description" tabindex="-1">
            <span class="dialog-icon" aria-hidden="true"><svg><use href="#check"/></svg></span>
            <h2 id="success-title">兑换成功</h2>
            <p id="success-description">已为这件装备兑换服务，无需再次支付。点击确认后查看服务订单详情。</p>
            <dl id="success-summary"></dl>
            <button class="primary" id="success-confirm" type="button">确认，查看订单详情</button>
            <p class="dialog-demo-note">设计演示：本地反馈，不提交订单、不占用或消耗权益。</p>
          </section>
        </div>
      </div>
    </div>
    <aside class="annotation">
      <p>Service as Offer / 页面设计</p>
      <h2>权益属于你，<br>只服务这件装备。</h2>
      <p class="description">先了解兑换的服务，再核对它对应的商品。保留服务原价，但不让顾客再次购买。</p>
      <dl><div><dt>已选方向</dt><dd>A · 服务优先，单一设计页面</dd></div><div><dt>服务与商品</dt><dd>服务卡片进入详情；来源订单关联具体装备。</dd></div><div><dt>演示边界</dt><dd>商品、资格及原价为示例，不执行兑换、支付或核销。</dd></div></dl>
      <a href="../design/service-as-offer-ux-spec.html#current-page-03">查看权益详情规范</a>
    </aside>
  </div>
  <script src="03-benefit-detail.js?v=20261104-cleanup"></script>
</body>
</html>
