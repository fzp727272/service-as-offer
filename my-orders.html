<body>
  <main class="stage">
    <article class="artboard" aria-label="我的订单页面设计画板">
      <div class="screen">
        <prototype-nav title="我的订单" back-href="01-service-entry.html?scenario=all" back-label="返回服务首页"></prototype-nav>
        <section class="orders-main" aria-label="服务订单列表">
          <div class="orders-tabs" role="tablist" aria-label="订单状态" id="order-filters"></div>
          <div class="orders-list" role="tabpanel" id="order-list"></div>
        </section>
        <nav class="tabbar" aria-label="主导航">
          <a class="tab" href="01-service-entry.html?scenario=all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-6 8 6v11h-6v-7h-4v7Z"/></svg><span>官方服务</span></a>
          <a class="tab is-current" href="my-orders.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM14 4h6v7h-6zM4 14h7v6H4zM14 14h6v6h-6z"/></svg><span>我的订单</span>
          </a>
        </nav>
        <div class="toast" id="order-toast" role="status" hidden></div>
      </div>
    </article>
    <aside class="design-panel" aria-labelledby="orders-design-title">
      <p class="design-kicker">SERVICE AS OFFER / PROTOTYPE</p>
      <h1 id="orders-design-title">我的订单</h1>
      <p>独立展示用户购买的服务订单，支持按履约状态筛选并查看对应操作入口。</p>
      <div class="design-facts">
        <div class="design-fact"><strong>信息层级</strong><span>订单状态筛选 → 订单与装备信息 → 预约 / 履约提示 → 订单操作。</span></div>
        <div class="design-fact"><strong>主要交互</strong><span>状态标签筛选当前样例订单；操作按钮进入对应的原型流程。</span></div>
        <div class="design-fact"><strong>页面拆分</strong><span>从服务首页底部“我的订单”入口进入本独立页面，返回按钮回到首页。</span></div>
        <div class="design-fact"><strong>画板规格</strong><span>375 × 812 CSS px；无手机边框，保留画板阴影。</span></div>
      </div>
      <div class="design-note">列表和状态数量均为设计评审示例，不表示完整订单、实时支付结果或真实服务进度。</div>
      <a class="design-link" href="equipment-library.html">查看我的装备设计稿</a>
      <a class="design-link" href="01-service-entry.html?scenario=all">返回服务首页设计稿</a>
    </aside>
  </main>
  <script src="my-orders.js?v=20261106-clickable-order-cards"></script>
