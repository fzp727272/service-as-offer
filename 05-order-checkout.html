<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Service as Offer 原型：服务结算页">
  <title>05 · 下单 / 确认订单 · Service as Offer</title>
  <link rel="stylesheet" href="05-order-checkout.css?v=20261106-booking-equipment-hierarchy">
  <link rel="stylesheet" href="store-time-picker.css?v=20261106-shared-picker">
  <script src="service-journey.js?v=20261104-one-css" defer></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="figma-capture-toolbar.js" defer></script>
 </head>
 <body data-page="checkout">
  <main class="presentation">
   <article class="artboard" aria-label="服务结算页设计画板">
    <div class="statusbar"><span>9:41</span><span class="status-icons" aria-hidden="true">● ▮ ▰</span></div>
    <header class="nav"><a class="back" href="02-service-detail.html" aria-label="返回服务详情">‹</a><span class="nav-title">确认订单</span><span class="more" aria-hidden="true"><span>•••</span><i></i><span class="more-target"></span></span></header>
    <section class="body">
    <div class="booking-module">
    <fieldset class="booking-options"><legend id="booking-section-title">到店安排</legend>
     <label class="booking-mode"><input type="radio" name="bookingMode" value="later" checked><span class="booking-mode-copy"><strong>暂不预约</strong></span></label>
     <label class="booking-mode"><input type="radio" name="bookingMode" value="now"><span class="booking-mode-copy"><strong>立即预约</strong></span></label>
    </fieldset>
    </div>
     <section class="section service-section" aria-label="本次服务">
      <div class="service"><div class="service-thumb" aria-hidden="true"><img id="service-image" src="assets/figma/checkout-service.png" alt=""></div><div class="service-info"><div class="service-name" id="service-name">自行车标准保养套餐</div><div class="service-meta" id="service-meta">自行车 · 到店服务</div></div><strong class="price" id="item-price">¥199.90</strong></div>
    <section class="section booking-section" aria-labelledby="booking-section-title">
      <div class="booking-summary" id="booking-summary"><span class="booking-summary-title">预约门店与时间</span><strong>支付成功后可在服务单中预约到店。</strong></div>
      <button type="button" class="booking-trigger" id="open-booking-sheet" hidden><span class="booking-trigger-copy"><span class="booking-trigger-label">预约门店与时间</span><strong id="booking-selection">请选择门店、日期和时段</strong></span><span class="booking-trigger-action"><span id="booking-action-label">选择</span><img src="assets/figma/chevron.svg" alt=""></span></button>
     </section>
      <div class="related-products" id="related-products"><h4>服务装备</h4><ul aria-label="服务装备"><li id="checkout-equipment">未指定，可用于自行车，到店时确认车型</li></ul></div>
     </section>
     <section class="section fee-section" aria-label="费用明细"><div class="fee-row"><span>服务费</span><strong id="service-fee">¥199.90</strong></div><div class="fee-row"><span>折扣优惠</span><span class="fee-discount">暂无</span></div><div class="fee-row fee-total"><span>合计：</span><strong id="fee-total">¥199.90</strong></div></section>
    <section class="section payment-section"><fieldset class="payment-options"><legend class="sr-only">支付方式</legend>
      <label class="payment-option"><span class="payment-icon"><img src="assets/figma/checkout-wechat.svg" alt=""></span><span class="payment-copy"><strong>微信支付</strong><small class="sr-only" id="wechat-amount">支付 ¥199.90</small></span><input type="radio" name="payment" value="wechat" checked></label>
      <label class="payment-option"><span class="payment-icon flame"><img src="assets/figma/checkout-flame.svg" alt=""></span><span class="payment-copy"><strong>燃脂抵扣</strong><small class="sr-only" id="points-amount">需扣除 19,990 燃值</small></span><input type="radio" name="payment" value="points"></label>
     </fieldset></section>

    </section>
    <p class="checkout-toast" id="checkout-toast" role="alert" aria-live="assertive" aria-atomic="true" hidden>请选择完整的门店、日期与可约时段。</p>
    <footer class="foot"><div class="foot-total" aria-live="polite"><span id="footer-label">应付金额</span><strong id="footer-total">¥199.90</strong></div><a class="cta" id="payment-action" href="05-payment-result.html">模拟微信支付</a></footer>
   </article>
  <aside class="annotation"><h1>结算</h1><p class="ann-desc">下单前核对服务、装备与费用；现在预约复用通用门店时间弹框，暂不预约则支付后继续安排。</p><a class="design-link" href="05-payment-result.html">查看支付结果</a></aside>
  </main>
  <script src="05-order-checkout.js?v=20261106-store-time-inline"></script>
</body>
</html>
